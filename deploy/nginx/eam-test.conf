# EAM (Uniprojekt, TEST/STAGING) — eam-test.messers-cardio-club.com
# Host-Nginx ist Reverse-Proxy + TLS-Terminierung. Docker Compose läuft lokal,
# lauscht nur auf 127.0.0.1:4001. Die Hauptdomain bleibt unberührt.
# Install: /etc/nginx/sites-available/eam-test  -> symlink in sites-enabled
# certbot --nginx ergänzt den listen-443/SSL-Block automatisch.

server {
  listen 80;
  listen [::]:80;
  server_name eam-test.messers-cardio-club.com;

  # Sicherheitsheader
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Testumgebung nicht in Suchmaschinen indexieren
  add_header X-Robots-Tag "noindex, nofollow" always;

  client_max_body_size 25m;

  # Optional, solange das EAM-Projekt keine eigene Auth hat (siehe Runbook):
  # auth_basic "EAM Demo";
  # auth_basic_user_file /etc/nginx/.htpasswd-eam;

  # OPTION: separates Backend-Routing — nur nötig, falls das Frontend /api NICHT
  # selbst intern ans Backend proxyt. Backend-Port aus der finalen
  # docker-compose.yml eintragen, dann einkommentieren.
  # location /api/ {
  #   proxy_pass http://127.0.0.1:<BACKEND_PORT>;
  #   proxy_http_version 1.1;
  #   proxy_set_header Host              $host;
  #   proxy_set_header X-Real-IP         $remote_addr;
  #   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  # }

  location / {
    proxy_pass http://127.0.0.1:4001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;   # WebSockets
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 60s;
  }
}
