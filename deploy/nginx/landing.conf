# Landing page — messers-cardio-club.com (+ www)
# Install as: /etc/nginx/sites-available/landing  → symlink into sites-enabled
# Serves the static Astro build from /var/www/landing.
# certbot --nginx adds the listen 443 / SSL block automatically.

server {
  listen 80;
  listen [::]:80;
  server_name messers-cardio-club.com www.messers-cardio-club.com;

  root /var/www/landing;
  index index.html;

  # Security headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Long-cache fingerprinted static assets (Astro hashes filenames in _astro/)
  location ~* \.(?:css|js|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Astro "directory" output: /faq -> faq/index.html
  location / {
    try_files $uri $uri/ =404;
  }

  # Optional: enforce gzip for text assets (nginx default gzip module)
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;
}

