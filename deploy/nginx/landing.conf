# Landing page — messers-cardio-club.com (+ www)
# Install as: /etc/nginx/sites-available/landing  → symlink into sites-enabled
# Serves the static Astro build from /var/www/landing.
# certbot --nginx adds the listen 443 / SSL block automatically.

server {
  listen 80;
  listen [::]:80;
  server_name messers-cardio-club.com www.messers-cardio-club.com;

  # Canonical host: always redirect www -> apex (avoids the www/non-www duplicate
  # that made Google pick www as canonical against our canonical tag).
  if ($host = www.messers-cardio-club.com) {
    return 301 https://messers-cardio-club.com$request_uri;
  }

  root /var/www/landing;
  index index.html;

  # Security headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Long-cache fingerprinted static assets (Astro hashes filenames in _astro/)
  location ~* \.(?:css|js|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Astro "directory" output: /faq -> faq/index.html
  location / {
    try_files $uri $uri/ =404;
  }

  # Optional: enforce gzip for text assets (nginx default gzip module)
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;
}

# Note: the www -> apex redirect is handled by the `if ($host = www…)` rule at
# the top of the server block above, so it applies to both the :80 block and the
# :443 block that certbot generates from this server_name.
