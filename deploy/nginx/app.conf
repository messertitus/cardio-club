# App (PWA) — app.messers-cardio-club.com
# Install as: /etc/nginx/sites-available/app  → symlink into sites-enabled
# Serves the Expo web export from /var/www/messers-cardio-club.
# certbot --nginx adds the listen 443 / SSL block automatically.

server {
  listen 80;
  listen [::]:80;
  server_name app.messers-cardio-club.com;

  root /var/www/messers-cardio-club;
  index index.html;

  # Security headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # PWA: never cache the service worker or manifest (so updates roll out)
  location = /mcc-push-worker.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /sw.js              { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  # Long-cache fingerprinted assets
  location ~* \.(?:css|js|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # SPA fallback for client-side routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;
}
