# Template for an additional project on the same server.
# Copy to /etc/nginx/sites-available/<project>, adjust, enable, run certbot.
#
# Two common shapes:
#   A) STATIC site  -> serve a directory (like the landing)
#   B) DYNAMIC app  -> reverse-proxy to a local port (Node/Python/Docker)

# ── A) Static ──────────────────────────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name project.messers-cardio-club.com;

  root /var/www/project;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / { try_files $uri $uri/ =404; }
}

