# messerscc.com — Redirect-Alias für messers-cardio-club.com (Landing + App + EAM)
#
# Die kurze Domain ist KEIN eigener Inhalt, sondern leitet jeden Host per 301
# dauerhaft auf sein Pendant unter messers-cardio-club.com um (Pfad bleibt
# erhalten). Eine einzige kanonische Domain → kein Duplicate-Content, die
# Indexierung von messers-cardio-club.com bleibt unangetastet.
#
# Install: /etc/nginx/sites-available/messerscc  → symlink in sites-enabled
#
# Bootstrap-Reihenfolge (siehe docs/deployment-ubuntu.md):
#   1. DNS: A-Records @, www, app, eam, eam-test → 93.90.201.126
#   2. Diese Datei (nur :80) aktivieren, nginx -t && reload
#   3. certbot --nginx -d messerscc.com -d www.messerscc.com \
#        -d app.messerscc.com -d eam.messerscc.com -d eam-test.messerscc.com
#      → certbot ergänzt den listen-443/SSL-Block automatisch.

# Host → Ziel-Host. Die map liegt im http-Kontext (sites-* werden in http{}
# eingebunden), daher außerhalb des server-Blocks.
map $host $mcc_alias_target {
    default                 messers-cardio-club.com;
    messerscc.com           messers-cardio-club.com;
    www.messerscc.com       messers-cardio-club.com;
    app.messerscc.com       app.messers-cardio-club.com;
    eam.messerscc.com       eam.messers-cardio-club.com;
    eam-test.messerscc.com  eam-test.messers-cardio-club.com;
}

server {
    listen 80;
    listen [::]:80;
    server_name messerscc.com www.messerscc.com app.messerscc.com eam.messerscc.com eam-test.messerscc.com;

    return 301 https://$mcc_alias_target$request_uri;
}
