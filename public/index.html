<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%" translate="no" class="notranslate">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MCC" />
    <meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />
    <meta name="theme-color" content="#05070b" />
    <meta name="application-name" content="Messers Cardio Club" />
    <meta name="description" content="Messers Cardio Club als installierbare Web-App." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/mcc-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/mcc-icon.png" />
    <link rel="icon" type="image/png" href="/mcc-icon.png" />
    <script src="/pwa-register.js" defer></script>
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body,
      #root {
        display: flex;
        flex: 1;
        height: 100%;
        min-height: 100dvh;
      }

      html,
      body {
        background: #05070b;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
      }

      body {
        overflow: hidden;
      }

      input,
      textarea,
      select,
      button {
        font-size: 16px !important;
      }

      * {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>

  <body>
    <noscript>JavaScript muss aktiviert sein, um Messers Cardio Club zu nutzen.</noscript>
    <div id="root"></div>
  </body>
</html>
